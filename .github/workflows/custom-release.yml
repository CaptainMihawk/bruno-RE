name: Custom Release (Linux & Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão base (o sufixo -custom.<execução> é adicionado automaticamente)'
        required: true
        default: '4.3.0'
      previous_tag:
        description: 'Tag anterior usada para gerar as notas (Full Changelog)'
        required: true
        default: 'v4.2.1'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            shell: bash
            pattern: 'packages/bruno-electron/out/*.AppImage'
          - name: Windows
            os: windows-latest
            shell: pwsh
            pattern: 'packages/bruno-electron/out/*.exe'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: ${{ matrix.shell }}

      - name: Build web app
        run: npm run build:web

      - name: Set app version
        run: npm version "${{ inputs.version }}-custom.${{ github.run_number }}" --no-git-tag-version --workspace=packages/bruno-electron

      - name: Build Electron distribution
        run: node scripts/build-electron.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bruno-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}-custom.${{ github.run_number }}"
          gh release create "$TAG" artifacts/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes \
            --notes-start-tag "${{ inputs.previous_tag }}"
